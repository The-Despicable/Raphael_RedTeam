[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "raphael-v2"
version = "2.0.0"
description = "Autonomous Cognitive Offensive AI Platform"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.3.0",
    "transformers>=4.41.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "requests>=2.32.0",
    "aiohttp>=3.9.0",
    "sqlalchemy>=2.0.30",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "click>=8.1.0",
    "rich>=13.7.0",
    "psutil>=5.9.0",
    "docker>=7.0.0",
    "paramiko>=3.4.0",
    "cryptography>=42.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["orchestrator*", "agent*", "raphael*", "arena*", "config*", "benchmarks*"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "*.yml", "*.txt", "*.md"]
